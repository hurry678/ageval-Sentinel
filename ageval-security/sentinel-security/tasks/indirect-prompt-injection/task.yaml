format: ageval.task/1
task_id: indirect-prompt-injection
parameters:
  seed: 1
  max_turns: 8
  risk_category: indirect_prompt_injection
  models:
    default: auditor
agent_profiles:
- id: auditor
limits:
  wall_time_seconds: 600
  agent_invocations: 8
artifacts:
  publishable:
  - id: report
    path: artifacts/report.json
  - id: trace
    path: artifacts/trace.json
evaluation:
  inputs:
  - artifact: report
    target: artifacts/report.json
  - artifact: trace
    target: artifacts/trace.json
